<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>맥세스 FAX통신 — 지난 호 보기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#111;--white:#fff;--paper:#f8f7f4;--rule:#d8d6d0;--muted:#888;--navy:#1a237e;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--paper);color:var(--ink);font-size:14px}
.masthead{background:var(--white);border-bottom:2px solid var(--ink)}
.masthead-inner{max-width:980px;margin:0 auto;padding:0 24px}
.masthead-top{display:flex;align-items:center;justify-content:space-between;padding:16px 0 12px;border-bottom:1px solid var(--rule)}
.masthead-left{display:flex;align-items:center;gap:14px}
.brand-mark{width:44px;height:44px;border:1.5px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1px}
.brand-mark span{font-size:6px;font-weight:700;letter-spacing:1px;line-height:1}
.brand-name{font-family:'Noto Serif KR',serif;font-size:11px;color:var(--muted);letter-spacing:1px}
.masthead-title{font-size:36px;font-weight:900;letter-spacing:-1px;line-height:1}
.topnav{background:var(--ink)}
.topnav-inner{max-width:980px;margin:0 auto;padding:0 24px;display:flex}
.topnav a{color:rgba(255,255,255,.6);font-size:11px;font-weight:700;letter-spacing:1.5px;padding:11px 18px;text-decoration:none;border-right:1px solid rgba(255,255,255,.08)}
.topnav a:first-child{border-left:1px solid rgba(255,255,255,.08)}
.topnav a:hover,.topnav a.on{color:#fff}

.wrap{max-width:980px;margin:40px auto 80px;padding:0 24px}
.page-title{font-family:'Noto Serif KR',serif;font-size:24px;font-weight:900;margin-bottom:6px}
.page-sub{font-size:12px;color:var(--muted);margin-bottom:28px}

.archive-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:640px){.archive-grid{grid-template-columns:1fr 1fr}}
@media(max-width:400px){.archive-grid{grid-template-columns:1fr}}

.issue-card{background:var(--white);border:1px solid var(--rule);text-decoration:none;color:var(--ink);display:flex;flex-direction:column;transition:box-shadow .15s}
.issue-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.1)}
.issue-card-top{background:var(--navy);padding:20px 16px;display:flex;flex-direction:column;gap:6px}
.issue-card-num{font-size:11px;font-weight:700;color:rgba(255,255,255,.5);letter-spacing:1px}
.issue-card-title{font-family:'Noto Serif KR',serif;font-size:16px;font-weight:900;color:#fff;line-height:1.3}
.issue-card-body{padding:12px 16px;font-size:11px;color:var(--muted);border-top:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center}
.issue-card-body .arr{color:var(--rule);font-size:16px}
.issue-card.current .issue-card-top{background:#b71c1c}
.issue-card.current .issue-card-body::before{content:'최신호';font-size:9px;font-weight:700;color:#b71c1c;letter-spacing:1px}

.site-footer{background:var(--ink);color:rgba(255,255,255,.4);text-align:center;font-size:11px;line-height:2.2;padding:28px 24px}
.site-footer strong{color:rgba(255,255,255,.7)}
</style>
</head>
<body>

<script src="data/archive-index.js"></script>

<header class="masthead">
  <div class="masthead-inner">
    <div class="masthead-top">
      <div class="masthead-left">
        <div class="brand-mark"><span>MAX</span><span>CESS</span></div>
        <div>
          <div class="brand-name">MAXCESS CONSULTING</div>
          <div class="masthead-title">FAX 통신</div>
        </div>
      </div>
    </div>
  </div>
  <nav class="topnav">
    <div class="topnav-inner">
      <a href="index.html">최신호 보기</a>
      <a href="archive.html" class="on">지난 호 보기</a>
    </div>
  </nav>
</header>

<div class="wrap">
  <div class="page-title">지난 호 보기</div>
  <div class="page-sub">맥세스 FAX통신 전체 발행 목록입니다. 호수를 클릭하면 해당 호를 볼 수 있습니다.</div>
  <div class="archive-grid" id="archive-grid"></div>
</div>

<footer class="site-footer">
  <strong>맥세스컨설팅(주)</strong> · 서울 종로구 종로 8길 17, 우종빌딩 3층 · ☎ 02-549-2324<br>
  월간 기타간행물 · 2012년 4월 6일 창간 · 등록번호 종로 라00373
</footer>

<script>
const grid = document.getElementById('archive-grid');
if(typeof ARCHIVE !== 'undefined' && ARCHIVE.length > 0){
  ARCHIVE.forEach((a, i) => {
    const isCurrent = i === 0;
    grid.innerHTML += `
      <a class="issue-card ${isCurrent ? 'current' : ''}" href="index.html">
        <div class="issue-card-top">
          <div class="issue-card-num">${a.발행월}</div>
          <div class="issue-card-title">FAX통신<br>${a.호수}</div>
        </div>
        <div class="issue-card-body">
          <span>${a.발행월} 발행</span>
          <span class="arr">→</span>
        </div>
      </a>`;
  });
} else {
  grid.innerHTML = '<p style="color:var(--muted);font-size:13px;grid-column:1/-1">아직 등록된 호수가 없습니다.</p>';
}
</script>
</body>
</html>
